name: Descubrir feeds de los BOP
on: workflow_dispatch
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python bop_discover.py
      - run: |
          git config user.name "radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Descubrimiento de feeds BOP" && git push)
